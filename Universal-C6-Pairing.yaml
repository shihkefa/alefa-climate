    appliance_id: appliance
    service: 14
    profile: ac
  - platform: appliance_auto
    name: "左右擺風 AC Horizontal"
    appliance_id: appliance
    service: 16
    profile: ac
  - platform: appliance_auto
    name: "睡眠 AC Sleep"
    appliance_id: appliance
    service: 5
    profile: ac
  - platform: appliance_auto
    name: "空氣清淨 AC Purifier"
    appliance_id: appliance
    service: 8
    profile: ac
  - platform: appliance_auto
    name: "濾網通知 AC Filter"
    appliance_id: appliance
    service: 18
    profile: ac
  - platform: appliance_auto
    name: "自動除霉 AC Mildew"
    appliance_id: appliance
    service: 23
    profile: ac
  - platform: appliance_auto
    name: "自我清潔 AC Clean"
    appliance_id: appliance
    service: 24
    profile: ac
  - platform: appliance_auto
    name: "強力模式 AC Boost"
    appliance_id: appliance
    service: 26
    profile: ac
  - platform: appliance_auto
    name: "省電模式 AC Eco"
    appliance_id: appliance
    service: 27
    profile: ac
  - platform: appliance_auto
    name: "空調蜂鳴器 AC Beeper"
    appliance_id: appliance
    service: 30
    profile: ac
  - platform: appliance_auto
    name: "加濕 AC Moisture"
    appliance_id: appliance
    service: 32
    profile: ac
  - platform: appliance_auto
    name: "結霜清洗 AC Frost"
    appliance_id: appliance
    service: 57
    profile: ac
  - platform: appliance_auto
    name: "自動風量 DH Auto"
    appliance_id: appliance
    service: 8
    profile: dehumidifier
  - platform: appliance_auto
    name: "除霉 DH Mildew"
    appliance_id: appliance
    service: 19
    profile: dehumidifier
  - platform: appliance_auto
    name: "濕度通知 DH Humidity"
    appliance_id: appliance
