    appliance_id: appliance
    service: 41
    profile: dehumidifier

number:
  - platform: appliance_auto
    name: "睡眠計時 AC Sleep Timer"
    appliance_id: appliance
    service: 6
    min_value: 0
    max_value: 1440
    step: 1
    profile: ac
  - platform: appliance_auto
    name: "開機計時 AC On Timer"
    appliance_id: appliance
    service: 11
    min_value: 0
    max_value: 1440
    step: 1
    profile: ac
  - platform: appliance_auto
    name: "關機計時 AC Off Timer"
    appliance_id: appliance
    service: 12
    min_value: 0
    max_value: 1440
    step: 1
    profile: ac
  - platform: appliance_auto
    name: "上下擺風角度 AC Vertical Level"
    appliance_id: appliance
    service: 15
    min_value: 0
    max_value: 15
    step: 1
    profile: ac
  - platform: appliance_auto
    name: "左右擺風角度 AC Horizontal Level"
    appliance_id: appliance
    service: 17
    min_value: 0
    max_value: 15
    step: 1
    profile: ac
  - platform: appliance_auto
    name: "目標濕度 DH RH"
    appliance_id: appliance
    service: 3
    min_value: 40
    max_value: 70
    step: 1
    profile: dehumidifier
  - platform: appliance_auto
    name: "除濕強度 DH Level"
    appliance_id: appliance
    service: 4
    min_value: 0
    max_value: 15
    step: 1
    profile: dehumidifier
  - platform: appliance_auto
    name: "除濕風速 DH Fan Level"
    appliance_id: appliance
    service: 14
    min_value: 0
    max_value: 15
    step: 1
    profile: dehumidifier

select:
  - platform: appliance_auto
    name: "除濕模式 DH Mode"
    appliance_id: appliance
    service: 1
    profile: dehumidifier
    options: [auto, normal, away, boost, baby, sleep, fan, comfort, home, eco]

sensor:
  - platform: appliance_auto
    name: "空調運轉電流 AC Current"
    appliance_id: appliance
    service: 36
    divisor: 10
    unit_of_measurement: A
    device_class: current
    state_class: measurement
    profile: ac
  - platform: appliance_auto
    name: "空調運轉電壓 AC Voltage"
    appliance_id: appliance
    service: 37
    unit_of_measurement: V
    device_class: voltage
    state_class: measurement
    profile: ac
  - platform: appliance_auto
    name: "空調功率 AC Power"
    appliance_id: appliance
    service: 39
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    profile: ac
  - platform: appliance_auto
    name: "空調累計能耗 AC Energy"
    appliance_id: appliance
    service: 40
    divisor: 10
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing
    profile: ac
  - platform: uptime
    name: Uptime
    filters:
      - lambda: return x / 3600;
    unit_of_measurement: h
    accuracy_decimals: 1
  - platform: internal_temperature
    name: Internal Temperature

matter:
  ble_thread: true
  pause_wifi_during_commissioning: true
  id: matter_bridge
  product_name: "Alpha Universal"
  endpoints:
    1:
      id: ac_endpoint
      thermostat:
        with_features: [heating, cooling, auto_mode]
      clusters:
        fan_control:
          with_features: [multi_speed, auto, rocking]
      on_attribute:
        thermostat.system_mode:
          - lambda: id(appliance).matter_mode(value);
        thermostat.occupied_heating_setpoint:
          - lambda: id(appliance).matter_target(true, value);
        thermostat.occupied_cooling_setpoint:
          - lambda: id(appliance).matter_target(false, value);
        fan_control.fan_mode:
          - lambda: id(appliance).matter_fan_mode(value);
        fan_control.percent_setting:
          - lambda: id(appliance).matter_fan_percent(value);
        fan_control.speed_setting:
          - lambda: id(appliance).matter_fan_speed(value);
        fan_control.rock_setting:
          - lambda: id(appliance).matter_vertical_swing(value);
    4:
      id: dehumidifier_endpoint
      fan:
        with_features: [multi_speed]

button:
  - platform: restart
    name: Restart
  - platform: template
    name: Matter Factory Reset
    entity_category: config
    disabled_by_default: true
    on_press:
      - matter.factory_reset:

text_sensor:
  - platform: wifi_info
    ip_address:
      name: WiFi IP Address
  - platform: version
    name: ESPHome Version
  - platform: matter
    qr_code:
      name: Matter QR Code
      internal: true
    manual_pairing_code:
      name: Matter Pairing Code
      internal: true

time:
  - platform: homeassistant
    id: homeassistant_time

pairing_portal:
  id: setup_portal
  matter_id: matter_bridge
  password: ${setup_password}
