# ESPHome Native API over Wi-Fi + Matter BLE commissioning into Thread.
# ESP32-C6 SuperMini, ESP-IDF. No preconfigured Thread dataset.
# Experimental firmware: USB flash and hardware validation required.
# UART TX19/RX20. Runtime detection: TaiSEIA 9600 8N1 / S21 2400 8E2.
# Requires the correct level shifter and appliance connector; software cannot identify wiring.

substitutions:
  devicename: alefa-climate
  upper_devicename: "Alpha"
  tx_pin_io: GPIO19
  rx_pin_io: GPIO20
  # Replace this placeholder before building a local device image.
  setup_password: "CHANGE_ME_SETUP_PASSWORD"

esphome:
  name: ${devicename}
  friendly_name: ${upper_devicename}
  # Share the toolchain cache; delivered AC BINs remain in release-v0.4.3.
  build_path: build/hitachi-c6-pairing
  min_version: 2026.10.1
  comment: "Auto TaiSEIA AC/dehumidifier + Daikin S21 + Matter + return-air temperature"
  name_add_mac_suffix: true
  project:
    name: "alefa.universal-c6"
    version: "0.6.11"

esp32:
  variant: ESP32C6
  flash_size: 4MB
  partitions: Climate-C6-Pairing-partitions.csv
  framework:
    type: esp-idf
    version: 5.5.6

external_components:
  # Protocol references and licenses: appliance_auto/SOURCES.txt.
  - source:
      type: local
      path: universal_c6_components
    components: [matter, pairing_portal, appliance_auto]

network:
  enable_ipv6: true

mdns:
  disabled: false

wifi:
  ap:
    password: ${setup_password}
    ap_timeout: 0s
  reboot_timeout: 0s
  power_save_mode: LIGHT

logger:
  hardware_uart: USB_SERIAL_JTAG
  level: INFO

light:
  - platform: esp32_rmt_led_strip
    id: status_rgb
    internal: true
    pin: GPIO8
    num_leds: 1
    chipset: WS2812
    # ESP32-C6 SuperMini onboard WS2812 uses GRB channel order.
    rgb_order: GRB
    restore_mode: ALWAYS_OFF

interval:
  - interval: 80ms
    then:
      - lambda: |-
          // A live appliance handshake is the highest-priority status: green.
          // Once Matter is paired, blue is used only when the appliance link
          // is not currently live; red means setup/Wi-Fi without a handshake.
          // Brightness oscillates so a repeated state remains visible.
          static float phase = 0.0f;
          phase += 0.10f;
          if (phase > 6.2831853f) phase -= 6.2831853f;
          const float brightness = 0.12f + 0.18f * (0.5f + 0.5f * sinf(phase));
          const int mode = id(appliance).online() ? 1 :
                           id(matter_bridge).commissioned() ? 2 : 0;
          auto call = id(status_rgb).turn_on();
          call.set_transition_length(0);
          call.set_brightness(brightness);
          if (mode == 2) call.set_rgb(0.0f, 0.15f, 1.0f);
          else if (mode == 1) call.set_rgb(0.0f, 1.0f, 0.0f);
          else call.set_rgb(1.0f, 0.0f, 0.0f);
          call.perform();

# ESPHome integration uses Wi-Fi. Matter independently uses Thread.
# 4 MB single-app layout: updates use USB, not OTA.
api:
  reboot_timeout: 0s

uart:
  id: uart_taixia
  tx_pin: ${tx_pin_io}
  rx_pin: ${rx_pin_io}
  baud_rate: 9600
  rx_buffer_size: 512

appliance_auto:
  id: appliance
  uart_id: uart_taixia
  matter_id: matter_bridge
  status:
    name: Appliance Connection
  brand:
    name: Appliance Brand
  model:
    name: Appliance Model
  protocol:
    name: Appliance Protocol

binary_sensor:
  - platform: gpio
    id: setup_button
    pin:
      number: GPIO9
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on: 30ms
      - delayed_off: 30ms
    on_click:
      - min_length: 10s
        max_length: 60s
        then:
          - lambda: id(matter_bridge).factory_reset_all();
  - platform: status
    name: Status
  - platform: appliance_auto
    name: "水箱滿水 DH Tank"
    appliance_id: appliance
    service: 10
    profile: dehumidifier
  - platform: appliance_auto
    name: "除濕濾網通知 DH Filter"
    appliance_id: appliance
    service: 11
    profile: dehumidifier
  - platform: appliance_auto
    name: "除霜中 DH Defrost"
    appliance_id: appliance
    service: 17
    profile: dehumidifier

# Both entities are generated; only the detected type is exposed at boot.
climate:
  - platform: appliance_auto
    id: appliance_climate
    name: "空調"
    appliance_id: appliance
fan:
  - platform: appliance_auto
    id: appliance_fan
    name: "除濕機"
    appliance_id: appliance
    profile: dehumidifier
  - platform: appliance_auto
    id: appliance_ac_fan
    name: "空調風速"
    appliance_id: appliance
    profile: ac

# The following service entities follow the service IDs and ranges used by
